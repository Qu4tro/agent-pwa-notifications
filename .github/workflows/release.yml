name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  deploy:
    name: migrate, deploy, release
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The D1 database keeps the name agent-dash: D1 has no rename.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply agent-dash --remote

      - name: Deploy the Worker
        run: pnpm exec wrangler deploy

      - name: Extract the release notes
        run: ./scripts/changelog-notes.sh "${GITHUB_REF_NAME}" > notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md

  publish-cli:
    name: publish the CLI to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      # No npm account is attached to this repo yet, so the whole job is a
      # no-op until an NPM_TOKEN secret exists. The AUR package builds from the
      # GitHub release tarball and does not need npm.
      - name: Look for an npm token
        id: token
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No NPM_TOKEN secret: skipping the npm publish.'
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4

      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the CLI version against the tag
        if: steps.token.outputs.present == 'true'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./cli/package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "cli/package.json is $have but the tag is $want." >&2
            exit 1
          fi

      - name: Publish
        if: steps.token.outputs.present == 'true'
        working-directory: cli
        run: npm publish --access public --provenance
